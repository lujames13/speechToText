name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'
          # Bare names on purpose: domain-scoped forms don't clear the action's
          # default web-tool disable (anthropics/claude-code-action#690).
          claude_args: '--allowedTools "WebSearch,WebFetch"'

      - name: Notify reviewer bot
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          GROK_WEBHOOK_URL: ${{ secrets.GROK_WEBHOOK_URL }}
          GROK_WEBHOOK_SECRET: ${{ secrets.GROK_WEBHOOK_SECRET }}
        run: |
          if [ -z "$GROK_WEBHOOK_URL" ] || [ -z "$GROK_WEBHOOK_SECRET" ]; then
            echo "::warning::webhook secrets not set, skipping notify"; exit 0
          fi
          ID=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
                 --jq '.[] | select(.user.login=="claude[bot]") | .id' | tail -1)
          STATUS=unknown
          if [ -n "$ID" ]; then
            BODY=$(gh api "repos/$REPO/issues/comments/$ID" --jq .body)
            STATUS=$(printf '%s' "$BODY" | grep -oP '<!-- agent-status: \K[a-z-]+' | tail -1 || true)
            STATUS=${STATUS:-unknown}
          fi
          [ "$OUTCOME" != "success" ] && STATUS=run-failed
          PAYLOAD=$(jq -n --arg repo "$REPO" --arg issue "$NUMBER" --arg status "$STATUS" \
                          --arg comment_id "${ID:-}" --arg run_id "$GITHUB_RUN_ID" \
                          '{repo:$repo, issue:$issue, status:$status, comment_id:$comment_id, run_id:$run_id}')
          curl -fsS -X POST "$GROK_WEBHOOK_URL" \
               -H "Authorization: Bearer $GROK_WEBHOOK_SECRET" \
               -H "Content-Type: application/json" -d "$PAYLOAD" \
            || echo "::warning::webhook notify failed"

